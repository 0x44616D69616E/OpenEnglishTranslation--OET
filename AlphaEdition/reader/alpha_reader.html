<style>
/* Layout concept: a printed study Bible crossed with a group chat's margin notes.
   One reading column; slang is a highlighter mark you can flip back to plain words;
   a compare view lines the Alpha text up against the OET-RV, verse for verse. */
:root {
  --bg: #F2F5F8;
  --surface: #FFFFFF;
  --ink: #13202C;
  --muted: #586878;
  --rule: #D3DBE3;
  --mark: #FFE066;
  --mark-ink: #13202C;
  --decoder: #0B7A85;
  --decoder-bg: #E1F4F6;
  --nerd: #4A4FD0;
  --nerd-bg: #E9EAFB;
  --focus: #1B5FD6;
  --bar-rv: #8794A2;
  --f-display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --f-text: "Newsreader", Georgia, "Times New Roman", serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F151B; --surface: #161E26; --ink: #E7EDF2; --muted: #97A6B4; --rule: #273340;
    --mark: #54450F; --mark-ink: #FFF3C2; --decoder: #58C4CE; --decoder-bg: #10303A;
    --nerd: #A5A9FF; --nerd-bg: #1E2150; --focus: #7FB0FF; --bar-rv: #6F7E8D;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F151B; --surface: #161E26; --ink: #E7EDF2; --muted: #97A6B4; --rule: #273340;
  --mark: #54450F; --mark-ink: #FFF3C2; --decoder: #58C4CE; --decoder-bg: #10303A;
  --nerd: #A5A9FF; --nerd-bg: #1E2150; --focus: #7FB0FF; --bar-rv: #6F7E8D;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--f-text);
  font-size: 1.125rem;
  line-height: 1.62;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 72px;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 30; background: var(--bg);
}
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 4px; }

/* ---- control bar ---- */
.bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: var(--bg); border-bottom: 1px solid var(--rule);
  margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px))) calc(-1 * max(16px, env(safe-area-inset-right, 0px)));
  padding: 10px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px));
}
.bar-inner { max-width: 1040px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: center; }
.group { display: flex; align-items: center; gap: 8px; min-width: 0; }
.group > span { font-family: var(--f-mono); font-size: .68rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 999px; background: var(--surface); padding: 2px; }
.seg button { border: 0; background: transparent; padding: 5px 13px; border-radius: 999px; font-family: var(--f-display); font-weight: 600; font-size: .88rem; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.switch { display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--rule); background: var(--surface); border-radius: 999px; padding: 5px 12px; font-family: var(--f-display); font-weight: 600; font-size: .88rem; }
.switch i { width: 26px; height: 15px; border-radius: 999px; background: var(--rule); position: relative; display: inline-block; }
.switch i::after { content: ""; position: absolute; top: 2px; left: 2px; width: 11px; height: 11px; border-radius: 50%; background: var(--surface); transition: transform .15s; }
.switch[aria-pressed="true"] i { background: var(--decoder); }
.switch[aria-pressed="true"] i::after { transform: translateX(11px); }

/* ---- page ---- */
main { max-width: 700px; margin: 0 auto; padding-top: 40px; }
main.wide { max-width: 1040px; }
.eyebrow { font-family: var(--f-mono); font-size: .72rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 0 0 10px; }
h1 { font-family: var(--f-display); font-weight: 800; font-size: clamp(2.1rem, 7vw, 3.5rem); line-height: 1.02; letter-spacing: -.02em; margin: 0 0 6px; text-wrap: balance; }
.subtitle { font-family: var(--f-display); color: var(--muted); font-size: 1.1rem; margin: 0 0 18px; }
.intro p { margin: 0 0 14px; max-width: 65ch; }
.hint { font-family: var(--f-display); font-size: .9rem; color: var(--muted); margin: 6px 0 0; }
.hint mark { font-family: inherit; }

.outline { display: flex; flex-wrap: wrap; gap: 8px; list-style: none; padding: 0; margin: 22px 0 0; }
.outline a { display: inline-flex; gap: 8px; align-items: baseline; text-decoration: none; color: var(--ink); background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; padding: 7px 12px; font-family: var(--f-display); font-weight: 600; font-size: .9rem; }
.outline a:hover { border-color: var(--ink); }
.outline small { font-family: var(--f-mono); font-weight: 500; color: var(--muted); font-size: .72rem; }

.chapter { margin-top: 56px; scroll-margin-top: 90px; }
.chapter-label { font-family: var(--f-mono); font-size: .75rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 0 0 4px; }
h2 { font-family: var(--f-display); font-weight: 800; font-size: clamp(1.4rem, 4.2vw, 1.9rem); line-height: 1.12; letter-spacing: -.01em; margin: 0 0 14px; text-wrap: balance; }
h3 { font-family: var(--f-display); font-weight: 600; font-size: 1.15rem; margin: 28px 0 8px; text-wrap: balance; }
.sub { font-style: italic; color: var(--muted); margin: 0 0 8px; }
p.text { margin: 0 0 14px; max-width: 65ch; }
p.poetry { margin: 0 0 8px; padding-left: 20px; border-left: 3px solid var(--rule); max-width: 60ch; }
sup.v { font-family: var(--f-mono); font-size: .62em; font-weight: 500; color: var(--muted); margin-right: 3px; vertical-align: .45em; }

mark.demo { background: var(--mark); color: var(--mark-ink); padding: 0 .18em; border-radius: .25em; font-family: inherit; }
mark.slang { background: var(--mark); color: var(--mark-ink); padding: 0 .18em; border-radius: .25em; box-decoration-break: clone; -webkit-box-decoration-break: clone; cursor: pointer; }
mark.slang.flip { background: transparent; color: var(--ink); text-decoration: underline wavy var(--decoder); text-underline-offset: 3px; }
mark.slang.gone { text-decoration: line-through; opacity: .6; }

.nbtn { display: inline-grid; place-items: center; width: 1.45em; height: 1.45em; border-radius: 50%; border: 1.5px solid currentColor; background: transparent; padding: 0; margin: 0 2px; font-family: var(--f-mono); font-size: .62em; font-weight: 500; vertical-align: .28em; line-height: 1; }
.nbtn.d { color: var(--decoder); } .nbtn.n { color: var(--nerd); }
.nbtn[aria-expanded="true"].d { background: var(--decoder); color: var(--surface); }
.nbtn[aria-expanded="true"].n { background: var(--nerd); color: var(--surface); }
.notebox { display: block; margin: 8px 0 12px; padding: 10px 14px; border-radius: 10px; font-size: .95rem; line-height: 1.5; max-width: 62ch; }
.notebox b { font-family: var(--f-mono); font-size: .68rem; letter-spacing: .08em; text-transform: uppercase; margin-right: 8px; }
.nb-d { background: var(--decoder-bg); } .nb-d b { color: var(--decoder); }
.nb-n { background: var(--nerd-bg); } .nb-n b { color: var(--nerd); }

/* compare */
.pair { display: grid; grid-template-columns: 1fr; gap: 6px; padding: 14px 0; border-top: 1px solid var(--rule); }
.pair .col { min-width: 0; }
.pair .rv { color: var(--muted); font-size: 1rem; }
.tag { display: inline-block; font-family: var(--f-mono); font-size: .62rem; letter-spacing: .08em; text-transform: uppercase; padding: 1px 7px; border: 1px solid var(--rule); border-radius: 999px; margin-right: 8px; vertical-align: .15em; color: var(--muted); background: var(--surface); }
@media (min-width: 760px) { .pair { grid-template-columns: 1fr 1fr; gap: 0 32px; } }

/* checks + decoder index */
.panel { margin-top: 64px; padding-top: 28px; border-top: 2px solid var(--ink); }
.panel h2 { font-size: 1.3rem; }
.bars { display: grid; gap: 8px; max-width: 520px; margin: 14px 0 6px; font-family: var(--f-display); font-size: .9rem; }
.bar-row { display: grid; grid-template-columns: 62px 1fr 38px; gap: 10px; align-items: center; }
.track { height: 14px; background: var(--rule); border-radius: 999px; overflow: hidden; }
.fill { height: 100%; border-radius: 999px; }
.fill.rv { background: var(--bar-rv); } .fill.alpha { background: var(--mark); box-shadow: inset 0 0 0 1.5px var(--ink); } .fill.plain { background: var(--decoder); }
.bar-row b { font-family: var(--f-mono); font-weight: 500; text-align: right; font-size: .82rem; }
.fine { font-family: var(--f-display); font-size: .86rem; color: var(--muted); max-width: 62ch; margin: 6px 0 0; }
ul.facts { padding-left: 1.1em; margin: 14px 0; max-width: 62ch; }
.scroll { overflow-x: auto; max-width: 100%; border: 1px solid var(--rule); border-radius: 10px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: .95rem; min-width: 480px; }
th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--rule); vertical-align: top; }
th { font-family: var(--f-mono); font-size: .68rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
tr:last-child td { border-bottom: 0; }
details { margin-top: 18px; }
summary { font-family: var(--f-display); font-weight: 600; cursor: pointer; }
footer { max-width: 62ch; margin: 56px auto 0; font-family: var(--f-display); font-size: .86rem; color: var(--muted); }
footer p { margin: 0 0 10px; }
footer a { color: var(--ink); }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } .switch i::after { transition: none; } }
</style>

<header class="bar">
  <div class="bar-inner">
    <div class="group"><span>Book</span><div class="seg" id="books" role="group" aria-label="Book"></div></div>

</header>

<script>
const DATA = {"books": [{"code": "JON", "title": "Yonah (Jonah)", "subtitle": "", "intro": ["Okay, so here’s the setup. A prophet named Yonah (you probably know him as ‘Jonah’) lived in northern Yisrael/Israel around 250 years after David became king, i.e., in the eighth century BC, perhaps around 785 BC. God gave him a simple assignment: go to the city of Nineveh in Ashur/Assyria and speak out against it. Yonah’s response? He bought a ticket in the opposite direction. That makes this account unusual among the prophetic books, because its main character is a prophet who *didn’t* do what God told him. He avoided the assignment because he suspected God would be merciful and call off the punishment if the people of that city turned away from their sins. Then came a storm, a huge fish, a beach, and a second chance, and Yonah ended up in Nineveh after all. And it worked: the king led a movement of turning back towards God. Yonah was furious that God then didn’t destroy the city. Yes, really.", "The author also wants us to notice that Yahweh is in control of everything he made: the ocean, the wind, a fish, a plant, a grub. But most of all, we’re told how loving and merciful God is, because even the enemies of his chosen people were forgiven and saved after they turned away from their sins. (Notice who’s still arguing at the very end of the story. It’s the prophet.)", "A note on how this one is told: the narration and the crowd scenes are in the way people actually tell a story to their friends, with slang, in the voice you’d hear at lunch. Anything that might need translating gets a footnote labelled *Decoder*, and anything that needs scholarly background gets a footnote labelled *Nerd note*. Tap any highlighted bit to see the plain wording. God’s words, the prayers, and the darkest moments stay plain on purpose; some things aren’t for joking. Slang ages fast, so if a word here already sounds embarrassing by the time you read it, that’s not a mistake. That’s how slang works."], "outline": [{"text": "Yonah runs from Yahweh’s assignment", "ref": "1:1-17"}, {"text": "Yonah’s prayer from inside the fish", "ref": "2:1-10"}, {"text": "Yonah gets a second chance and goes to Nineveh", "ref": "3:1-10"}, {"text": "Yonah has a meltdown over God’s mercy", "ref": "4:1-11"}], "chapters": [{"n": 1, "verses": [{"n": "1", "para": true, "poetry": false, "a": [{"t": "zs", "a": "Okay, so Yahweh", "p": "Now Yahweh"}, {"t": "text", "s": " gave Yonah (Jonah), Amitay’s son, an assignment."}, {"t": "xref", "s": "2Ki 14:25"}, {"t": "note", "kind": "nerd", "s": "A prophet named Yonah, son of Amitay, is also mentioned in 2 Kings 14:25, which is the basis for placing him in the 700s BC."}], "rv": "Now Yahweh told Yonah (Jonah) ( Yonah, Amitay’s son),", "xrefs": ["2Ki 14:25."], "h": {"a": "Yonah gets an assignment and flees the country", "rv": "Yonah tries to run from God"}, "sub": "Northern kingdom"}, {"n": "2", "para": false, "poetry": false, "a": [{"t": "text", "s": "“Go to Nineveh, that huge city, and call it out. I’ve seen how evil they are.”"}], "rv": "“Go now to the major city of Nineveh, and speak out against it because I’ve noticed how evil they are.”", "xrefs": []}, {"n": "3", "para": true, "poetry": false, "a": [{"t": "text", "s": "Yonah’s response: "}, {"t": "zs", "a": "absolutely not", "p": "no"}, {"t": "text", "s": ". He "}, {"t": "zs", "a": "ghosted Yahweh", "p": "decided to run away from Yahweh"}, {"t": "text", "s": ", so he went down to Yafo (Joppa), found a ship about to leave for Tarshish, paid the fare, and hopped aboard, headed for Tarshish to get away from Yahweh. "}, {"t": "zs", "a": "Delulu plan, but he committed.", "p": ""}, {"t": "note", "kind": "decoder", "s": "‘Ghosted’ means cutting someone off and vanishing without a word. It’s usually said about texts and dating, and here it’s about God."}, {"t": "note", "kind": "decoder", "s": "‘Delulu’ is short for ‘delusional’, and it means hopelessly unrealistic. Running from God by boat is a strong candidate."}, {"t": "note", "kind": "nerd", "s": "Tarshish is thought to be far to the west across the Mediterranean (Spain is a popular guess, but scholars aren’t certain). Nineveh was to the east. Yonah didn’t just leave; he picked the opposite direction."}], "rv": "But Yonah decided to run away from Yahweh so he went down to Yafo (Joppa) and found a ship about to go to Tarshish. He paid the fare and went aboard to go with them to Tarshish to get away from Yahweh.", "xrefs": []}, {"n": "4", "para": true, "poetry": false, "a": [{"t": "text", "s": "Then Yahweh sent a "}, {"t": "zs", "a": "massive", "p": "powerful"}, {"t": "text", "s": " wind over the sea, and the storm got so wild that everyone on board was convinced the ship was "}, {"t": "zs", "a": "straight-up cooked", "p": "about to fall apart"}, {"t": "text", "s": "."}, {"t": "note", "kind": "decoder", "s": "‘Cooked’ means finished, done for."}], "rv": "However Yahweh caused a strong wind on the sea and it became a such big storm that they all thought the ship would disintegrate.", "xrefs": []}, {"n": "5", "para": false, "poetry": false, "a": [{"t": "text", "s": "The sailors were "}, {"t": "zs", "a": "losing it", "p": "terrified"}, {"t": "text", "s": ". Every single one of them started yelling to their own gods for help, and they threw the cargo overboard to make the ship lighter. "}, {"t": "zs", "a": "And Yonah? Down", "p": "Meanwhile, Yonah had gone down"}, {"t": "text", "s": " in the hold, "}, {"t": "zs", "a": "lying down, fast asleep", "p": "lain down, and fallen fast asleep"}, {"t": "zs", "a": ": major aura, or major denial", "p": ", either perfectly calm or in complete denial"}, {"t": "text", "s": "."}, {"t": "note", "kind": "decoder", "s": "‘Aura’ is slang for effortless coolness. Sleeping through a storm that has professional sailors praying earns Yonah either a lot of aura or none, depending on whom you ask."}], "rv": "The sailors were afraid and they each cried to their own gods for help, and they threw the cargo overboard to make the ship lighter. But Yonah had gone down into the hold where he had laid down and fallen fast asleep.", "xrefs": []}, {"n": "6", "para": true, "poetry": false, "a": [{"t": "text", "s": "The ship’s captain went to him and "}, {"t": "zs", "a": "was like", "p": "said"}, {"t": "text", "s": ", “"}, {"t": "zs", "a": "Bruh. ", "p": ""}, {"t": "text", "s": "How are you sleeping right now? Get up and pray to your god. Maybe he’ll notice us and we won’t die.”"}, {"t": "note", "kind": "decoder", "s": "‘Bruh’ is a reaction word, roughly ‘come on, really?’"}], "rv": "So the ship’s captain approached him and said, “Why are you sleeping? Come on, pray to your god and perhaps he will take notice of us so we won’t die.”", "xrefs": []}, {"n": "7", "para": true, "poetry": false, "a": [{"t": "text", "s": "Then the sailors "}, {"t": "zs", "a": "went,", "p": "said to each other,"}, {"t": "text", "s": " “Let’s draw straws and find out whose fault this disaster is.” So they drew straws, and Yonah got picked. "}, {"t": "zs", "a": "Shocker.", "p": ""}], "rv": "Then the sailors said to each other, “Let’s draw straws to find out whose fault it is that we are in this predicament.” So they drew straws and Yonah was indicated.", "xrefs": []}, {"n": "8", "para": false, "poetry": false, "a": [{"t": "text", "s": "So they "}, {"t": "zs", "a": "hit him with questions", "p": "said to him"}, {"t": "text", "s": ": “Okay, explain. Why is this disaster happening to us? What do you do for a living? Where are you from? What country? What’s your nationality?”"}], "rv": "So they said to him, “Hey, tell us why this disaster is happening to us. What’s your occupation? Where are you from? What country? What nationality are you?”", "xrefs": []}, {"n": "9", "para": true, "poetry": false, "a": [{"t": "text", "s": "And he said to them, “I’m an Ivri (Hebrew), and I fear Yahweh, the god of heaven, who made the sea and the land.”"}, {"t": "note", "kind": "nerd", "s": "The Hebrew root for ‘fear’ shows up in verses 5, 9, 10 and 16, sometimes as ‘revere’ (here) and sometimes as ‘terrified’ (the sailors). Also notice the irony: Yonah says Yahweh made the sea and the land while sailing away across the sea."}], "rv": "And he said to them, “I’m a Ivri (Hebrew) and I fear Yahweh the god of the heavens who made the sea and the land.”", "xrefs": []}, {"n": "10", "para": true, "poetry": false, "a": [{"t": "text", "s": "The men "}, {"t": "zs", "a": "lost it", "p": "panicked"}, {"t": "text", "s": ". “"}, {"t": "zs", "a": "Bruh. ", "p": ""}, {"t": "text", "s": "WHAT did you do?!” they asked, because Yonah had already told them that he was running from Yahweh."}], "rv": "And the men became really scared and asked him what he had done, because he had told them that he was running from Yahweh.", "xrefs": []}, {"n": "11", "para": true, "poetry": false, "a": [{"t": "text", "s": "Then they asked him, “Okay, so what do we do with you to make the sea calm down?” Because the storm was getting worse by the second."}], "rv": "So they asked him what they should do to him so that the sea would calm, because the storm was getting worse.", "xrefs": []}, {"n": "12", "para": true, "poetry": false, "a": [{"t": "text", "s": "And he said to them, “Pick me up and throw me into the sea, and it will calm down. I know this terrible storm came because of me.”"}], "rv": "And he said to them, “Pick me up and throw me into the sea so that the sea will calm down because I know that this terrible storm came because of me.”", "xrefs": []}, {"n": "13", "para": true, "poetry": false, "a": [{"t": "text", "s": "Even so, the men tried to row back to land, but they couldn’t. The sea just kept getting wilder and wilder. "}, {"t": "zs", "a": "(Points for trying.)", "p": ""}], "rv": "However, the men tried to row but they were not able to return to the land because the sea was very rough and getting worse.", "xrefs": []}, {"n": "14", "para": false, "poetry": false, "a": [{"t": "text", "s": "So they called out to Yahweh: “We’re begging you, Yahweh: please don’t let us die because of this man, and don’t hold us guilty for this. You’re the one who made it happen.”"}], "rv": "So they called to Yahweh and said, “We beg you Yahweh: please don’t let us die because of this man, and don’t consider us guilty because you yourself have made this happen.”", "xrefs": []}, {"n": "15", "para": false, "poetry": false, "a": [{"t": "text", "s": "Then they picked Yonah up and threw him into the sea, and the sea went calm."}], "rv": "And then they picked up Yonah and threw him into the sea, and the sea became calm.", "xrefs": []}, {"n": "16", "para": false, "poetry": false, "a": [{"t": "text", "s": "The men were so in awe of Yahweh, and honestly terrified of him, that they offered a sacrifice to him and made vows."}], "rv": "The men felt really scared of Yahweh and they sacrificed to him and made vows.", "xrefs": []}, {"n": "17", "para": true, "poetry": false, "a": [{"t": "text", "s": "Then Yahweh ordered a huge fish to swallow Yonah (Jonah), and he stayed in the belly of the fish for three days and three nights. "}, {"t": "zs", "a": "Three. Whole. Days.", "p": ""}, {"t": "xref", "s": "Mat 12:40"}, {"t": "note", "kind": "nerd", "s": "The Hebrew says ‘huge fish’, not ‘whale’. The whale tradition comes from later translations, where the Greek used a word that means something like ‘sea monster’."}], "rv": "Then Yahweh commanded a huge fish to swallow Yonah (Jonah) and he stayed in the belly of the fish for three days and three nights.", "xrefs": ["Mat 12:40."]}]}, {"n": 2, "verses": [{"n": "1", "para": true, "poetry": false, "a": [{"t": "text", "s": "Then Yonah (Jonah) prayed to Yahweh his god from inside the fish."}], "rv": "And Yonah (Jonah) prayed to Yahweh his god from the belly of the fish.", "xrefs": [], "h": {"a": "Yonah’s prayer from inside the fish", "rv": "Yonah’s prayer"}}, {"n": "2", "para": false, "poetry": false, "a": [{"t": "text", "s": "And he said,"}, {"t": "para"}, {"t": "text", "s": "“I called out to you, Yahweh, when I was in trouble, and you answered me. From the valley of death I cried for help, and you heard my voice."}], "rv": "And he said,\n“I called to you Yahweh in my distress and you answered me. I cried for help from the valley of death and you heard my voice.", "xrefs": []}, {"n": "3", "para": true, "poetry": true, "a": [{"t": "text", "s": "You threw me right into the deep, into the heart of the sea, and the flood surrounds me. All your waves are crashing over me."}], "rv": "You have thrown me right into the deep—the heart of the sea; and a flood surrounds me. All your waves are crashing over me.", "xrefs": []}, {"n": "4", "para": true, "poetry": true, "a": [{"t": "text", "s": "I thought, ‘I’ve been driven out of your sight, but I’ll look again towards your holy temple.’"}], "rv": "And I said, ‘I have been driven out of your sight however I will look again towards your holy temple.’", "xrefs": []}, {"n": "5", "para": true, "poetry": true, "a": [{"t": "text", "s": "The water came up to my neck; the deep was all around me. Reeds were wrapped around my head."}], "rv": "I was up to my neck in the waters; it was deep all around me. There were reeds wrapped around my head.", "xrefs": []}, {"n": "6", "para": true, "poetry": true, "a": [{"t": "text", "s": "I went down to the roots of the mountains, locked out of ever returning to land. But you saved my life from the grave, Yahweh my god."}], "rv": "I went down to the foundations of the mountains; barred from returning to the land. But you saved my life from the grave, Yahweh my god.", "xrefs": []}, {"n": "7", "para": true, "poetry": true, "a": [{"t": "text", "s": "When my life was draining away, I remembered you, Yahweh, and my prayer reached you in your holy temple."}], "rv": "When my life was draining away from me, I remembered you, Yahweh, and my prayer reached you in your holy temple.", "xrefs": []}, {"n": "8", "para": true, "poetry": true, "a": [{"t": "text", "s": "People who chase lifeless gods abandon their loyalty to you."}], "rv": "Those who worship lifeless gods abandon their allegiance to you.", "xrefs": []}, {"n": "9", "para": true, "poetry": true, "a": [{"t": "text", "s": "But I’ll thank you out loud and offer you a sacrifice. I made a vow and I’ll keep it, because Yahweh is my rescuer.”"}, {"t": "note", "kind": "nerd", "s": "Many readers have noticed that this prayer is all thanksgiving. There is no ‘sorry’ anywhere in it."}], "rv": "But I’ll speak out my gratitude as I sacrifice to you. I’ve vowed this and I’ll do it, because Yahweh is my rescuer.”", "xrefs": []}, {"n": "10", "para": true, "poetry": false, "a": [{"t": "text", "s": "Then Yahweh spoke to the fish, and it "}, {"t": "zs", "a": "yeeted", "p": "threw up"}, {"t": "text", "s": " Yonah (Jonah) onto dry land"}, {"t": "zs", "a": ": respawn complete", "p": ""}, {"t": "text", "s": "."}, {"t": "note", "kind": "decoder", "s": "‘Yeeted’ means threw hard and fast, with no care for the landing."}, {"t": "note", "kind": "decoder", "s": "‘Respawn’ is a video-game word for coming back after you’ve been defeated. Gamers would call this one a respawn, though the beach is not a standard spawn point."}], "rv": "Then Yahweh spoke to the fish and it vomited Yonah (Jonah) up onto the land.", "xrefs": []}]}, {"n": 3, "verses": [{"n": "1", "para": true, "poetry": false, "a": [{"t": "text", "s": "And Yahweh spoke to Yonah (Jonah) "}, {"t": "zs", "a": "round two", "p": "a second time"}, {"t": "text", "s": ":"}], "rv": "And Yahweh spoke to Yonah (Jonah) a second time saying,", "xrefs": [], "h": {"a": "Second chance, same assignment", "rv": "Yonah goes to Nineveh"}}, {"n": "2", "para": false, "poetry": false, "a": [{"t": "text", "s": "“Go to Nineveh, that huge city, and announce the message I’m giving you.”"}], "rv": "“Go now to the major city, Nineveh, and announce this declaration which I’ve told you.”", "xrefs": []}, {"n": "3", "para": true, "poetry": false, "a": [{"t": "text", "s": "So this time Yonah skipped the "}, {"t": "zs", "a": "side quests", "p": "detours"}, {"t": "text", "s": " and went straight to Nineveh"}, {"t": "zs", "a": ", locked in", "p": ""}, {"t": "text", "s": ". It was an enormous city; "}, {"t": "zs", "a": "like, ", "p": ""}, {"t": "text", "s": "it took three days to get across."}, {"t": "note", "kind": "decoder", "s": "‘Side quests’ are optional detours in a video game, away from the main mission. Yonah’s trip to Tarshish was one, and a big one."}, {"t": "note", "kind": "decoder", "s": "‘Locked in’ means fully focused. This time, Yonah is."}], "rv": "So Yonah went directly to Nineveh. It was a large city, taking three days to travel across.", "xrefs": []}, {"n": "4", "para": false, "poetry": false, "a": [{"t": "text", "s": "Yonah went one day’s travel into the city and announced, "}, {"t": "zs", "a": "no cap, ", "p": ""}, {"t": "text", "s": "that Nineveh was "}, {"t": "zs", "a": "cooked", "p": "finished"}, {"t": "text", "s": ": “Nineveh is going to be destroyed in forty days!” "}, {"t": "zs", "a": "That was the whole pitch.", "p": ""}, {"t": "xref", "s": "Mat 12:41; Luk 11:32"}, {"t": "note", "kind": "decoder", "s": "‘No cap’ means ‘for real’, with no lie."}, {"t": "note", "kind": "decoder", "s": "‘Cooked’ means finished, done for."}, {"t": "note", "kind": "nerd", "s": "In Hebrew, Yonah’s whole sermon is five words. The last word can mean ‘overthrown’, and Nineveh’s next move is to turn itself around."}], "rv": "Yonah went one day’s travel into the city and publicly announced, “Nineveh is going to be destroyed in forty days!”", "xrefs": ["Mat 12:41; Luk 11:32."]}, {"n": "5", "para": true, "poetry": false, "a": [{"t": "text", "s": "The people of Nineveh believed God, and they "}, {"t": "zs", "a": "speedran the whole turnaround", "p": "acted quickly"}, {"t": "text", "s": ": they announced a time of fasting, and from the least to the most important, they all put on sackcloth as a sign of sorrow for what they’d done."}, {"t": "note", "kind": "decoder", "s": "‘Speedran’ comes from gaming, where a speedrun means finishing as fast as possible. Nineveh’s turnaround took one sermon."}], "rv": "The people of Nineveh believed in God and announced a time of fasting, and from the least to the most important people, they just wore sackcloth as a sign of contrition.", "xrefs": []}, {"n": "6", "para": true, "poetry": false, "a": [{"t": "text", "s": "When the news reached the king of Nineveh, he got down from his throne, took off his robe, put on sackcloth, and sat in a pile of ashes. "}, {"t": "zs", "a": "The king. Himself.", "p": ""}, {"t": "note", "kind": "nerd", "s": "Notice the order: the people respond in verse 5, and only then does the news reach the king in verse 6. In this story, the change starts at the bottom."}], "rv": "The king of Nineveh also heard about it and he got down from his throne, took off his robe and put on sackcloth, then sat in a pile of ashes.", "xrefs": []}, {"n": "7", "para": false, "poetry": false, "a": [{"t": "text", "s": "Then he had a statement written out and publicly read all through Nineveh: “By order of the king and his advisors: no people or animals, whether herds or flocks, may graze or eat anything, and they can’t even drink water."}], "rv": "And he had a statement written out and publicly read throughout Nineveh, saying, “The king and his advisors declare that people and livestock, be it herds or flocks, are prohibited from grazing or eating anything, and even from drinking water.", "xrefs": []}, {"n": "8", "para": false, "poetry": false, "a": [{"t": "text", "s": "People and animals alike must wear sackcloth, and everyone should use all their strength to cry out to God and turn away from the evil and violent things they’ve been doing."}], "rv": "Both people and livestock should just wear sacks, and they should use their strength to cry out to God and they should turn away from the evil and violent things they have been doing.", "xrefs": []}, {"n": "9", "para": false, "poetry": false, "a": [{"t": "text", "s": "Maybe God will turn around and change his mind and put away his fierce anger, and maybe we won’t die.”"}], "rv": "And maybe God will turn and change his mind and stop his fierce anger, and maybe we won’t die.”", "xrefs": []}, {"n": "10", "para": true, "poetry": false, "a": [{"t": "text", "s": "God saw what they did, how they turned away from their evil ways, and he changed his mind about the destruction he’d said he would send on them. He didn’t go through with it."}], "rv": "And God saw their actions in turning away from their evil ways and he changed his mind about the destruction which he had said he would send to them and he didn’t proceed with it.", "xrefs": []}]}, {"n": 4, "verses": [{"n": "1", "para": true, "poetry": false, "a": [{"t": "text", "s": "But Yonah (Jonah) was "}, {"t": "zs", "a": "full-on crashing out", "p": "beside himself"}, {"t": "text", "s": ", "}, {"t": "zs", "a": "absolutely", "p": ""}, {"t": "text", "s": " furious about the whole situation."}, {"t": "note", "kind": "decoder", "s": "‘Crashing out’ is current slang for a full emotional meltdown."}], "rv": "But Yonah (Jonah) was very upset and the situation made him angry.", "xrefs": [], "h": {"a": "Yonah has a meltdown", "rv": "Yonah gets upset"}}, {"n": "2", "para": false, "poetry": false, "a": [{"t": "text", "s": "And he said to Yahweh, “Okay, Yahweh, isn’t this exactly what I said would happen when I was still in my own country? That’s why I ran away to Tarshish the first time: I knew that you’re a caring, forgiving god, slow to get angry, full of kindness, and not wanting to cause suffering."}, {"t": "xref", "s": "Exo 34:6"}, {"t": "note", "kind": "nerd", "s": "This echoes a famous description of God in Exodus 34:6. Most people treat that description as good news. Yonah treats it as a spoiler."}], "rv": "And he said to Yahweh, “Please Yahweh, wasn’t this what I said would happen when I was still in my own country? That’s why I fled to Tarshish the first time, because I knew that you are a caring forgiving god, who doesn’t get angry quickly; full of kindness and not wanting to cause distress.", "xrefs": ["Exo 34:6."]}, {"n": "3", "para": false, "poetry": false, "a": [{"t": "text", "s": "So now, Yahweh, please kill me, because I’d rather die than live like this.”"}, {"t": "xref", "s": "1Ki 19:4"}], "rv": "So therefore Yahweh, please kill me because I’d rather die than live like this.”", "xrefs": ["1Ki 19:4."]}, {"n": "4", "para": true, "poetry": false, "a": [{"t": "text", "s": "But Yahweh said, “Do you really think it’s right to be this angry?”"}], "rv": "But Yahweh said, “Do you think it’s right to be angry like that?”", "xrefs": []}, {"n": "5", "para": true, "poetry": false, "a": [{"t": "text", "s": "And Yonah went outside the city to the east, made himself a shelter, and sat in its shade to see what would happen to the city."}], "rv": "And Yonah went outside the city to the east and made himself a shelter and sat there in the shade to see what would happen to the city.", "xrefs": []}, {"n": "6", "para": false, "poetry": false, "a": [{"t": "text", "s": "Then Yahweh God commanded a plant to grow up over Yonah, to shade his head and ease his misery. Yonah was "}, {"t": "zs", "a": "highkey obsessed with", "p": "thrilled about"}, {"t": "text", "s": " the plant."}, {"t": "note", "kind": "decoder", "s": "‘Highkey’ means openly and fully, the opposite of ‘lowkey’."}, {"t": "note", "kind": "nerd", "s": "This is the only place in the whole story where Yonah is described as happy, and it’s about a plant."}], "rv": "And Yahweh God commanded a plant and it grew up over Yonah to shade his head and to relieve him from his distress. Yonah was very pleased about the plant.", "xrefs": []}, {"n": "7", "para": false, "poetry": false, "a": [{"t": "text", "s": "Then at dawn the next day God commanded a grub, and it attacked the plant, which "}, {"t": "zs", "a": "got cooked", "p": "shriveled up"}, {"t": "text", "s": "."}], "rv": "Then at dawn the next day God commanded a grub and it attacked the plant which then shrivelled up.", "xrefs": []}, {"n": "8", "para": false, "poetry": false, "a": [{"t": "text", "s": "And when the sun came up, God sent a scorching east wind and the sun beat down on Yonah’s head. He felt faint and asked for his life to end, saying, “It’s better for me to die than to live.”"}], "rv": "And when the sun came up, God sent a hot east wind and the sun beat on Yonah’s head. He became faint and asked for his life to end and said, “It’s better for me to die than to live.”", "xrefs": []}, {"n": "9", "para": true, "poetry": false, "a": [{"t": "text", "s": "And God said to Yonah, “Do you really think it’s right to be angry about the plant?”"}, {"t": "para"}, {"t": "text", "s": "And Yonah replied, “Yes, I’m angry enough to die!”"}], "rv": "And God said to Yonah, “Do you think it’s right to be angry about the plant?”\nAnd Yonah replied, “Yes, I’m angry enough to die!”", "xrefs": []}, {"n": "10", "para": true, "poetry": false, "a": [{"t": "text", "s": "Then Yahweh said, “You felt sorry for a plant that you didn’t plant or work for. It shot up in a day and died in a day,"}], "rv": "Then Yahweh said, “You felt sorry for the plant which you didn’t even plant or work for. It came up in a day and died again in a day", "xrefs": []}, {"n": "11", "para": false, "poetry": false, "a": [{"t": "text", "s": "so shouldn’t I feel sorry for the huge city of Nineveh, which has so many people in it who don’t know right from wrong, over 120,000 people, not to mention all the livestock!”"}, {"t": "note", "kind": "nerd", "s": "The book ends on a question, and Yonah never answers it on the page. Whether he comes around is left to the reader."}], "rv": "so shouldn’t I feel sorry for the huge city of Nineveh which has so many people in it who don’t know right from wrong—over 120,000 people, not to mention all the livestock!”", "xrefs": []}]}], "checks": {"verses": 48, "footnotes": 24, "decoder": 14, "nerd": 10, "spans": 34, "slang_hits": 18, "fk": {"rv": 7.175515209428255, "alpha": 5.223939591420397, "plain": 5.960042989084801}, "words_alpha": 1215, "words_rv": 1195, "errors": 0, "warnings": 0}}, {"code": "PHM", "title": "Filemon", "subtitle": "Paulos’s letter to", "intro": ["Filemon was a follower of Yeshua and part of a group of believers in the city of Kolossai. He owned a slave named Onesimos, who ran away and eventually met Paulos the missionary in prison in Romai. There, thanks to Paulos sharing the good message, Onesimos became a believer in Yeshua. In *Paulos’s letter to Filemon*, Paulos asks Filemon to repair the relationship with Onesimos: he’s sending Onesimos back, and he wants Filemon to take him in, not just because he’s forgiven him, but because Onesimos is now a fellow believer and therefore a brother.", "This is the shortest of Paulos’s surviving letters, and it’s a masterclass in asking for something difficult without simply giving an order. Notice how often he chooses to ask instead of command. Footnotes in this edition are labelled *Decoder* (for slang) and *Nerd note* (for background)."], "outline": [{"text": "Introduction", "ref": "1-3"}, {"text": "Praising Filemon", "ref": "4-7"}, {"text": "Paulos’s request about Onesimos", "ref": "8-22"}, {"text": "Ending", "ref": "23-25"}], "chapters": [{"n": 1, "verses": [{"n": "1", "para": true, "poetry": false, "a": [{"t": "text", "s": "This letter is from Paulos, a prisoner of messiah Yeshua (Jesus; Grk. Yesus), and our brother Timotheos, to our dear co-worker Filemon (Philemon),"}], "rv": "This letter is from Paulos, a prisoner of messiah Yeshua (Jesus; Grk. Yesus), and our brother Timotheos. I’m writing to our dear co-worker Filemon (Philemon),", "xrefs": []}, {"n": "2", "para": false, "poetry": false, "a": [{"t": "text", "s": "and to our sister Apfia and our fellow soldier Arkippos,"}, {"t": "xref", "s": "Col 4:17"}, {"t": "text", "s": " and to the assembly that meets in your home."}, {"t": "note", "kind": "nerd", "s": "The letter is addressed to the whole house assembly, not just Filemon. Verses 3 and 25 use ‘you all’, so the request about Onesimos is made with an audience listening."}], "rv": "as well as our sister Apfia and our fellow-soldier Arkippos, and to the assembly that meets in your home.", "xrefs": ["Col 4:17."]}, {"n": "3", "para": false, "poetry": false, "a": [{"t": "text", "s": "Grace and peace to you all from our father God and from the master Yeshua the messiah."}], "rv": "May you all experience grace and peace from our father God and from the master Yeshua the messiah.", "xrefs": []}, {"n": "4", "para": true, "poetry": false, "a": [{"t": "text", "s": "Filemon (Philemon), I’m always thanking my God and mentioning you in my prayers,"}], "rv": "Filemon (Philemon) , I’m always thanking my God and mentioning you in my prayers", "xrefs": [], "h": {"a": "Paulos’s prayer and gratefulness", "rv": "Paulos’s prayer and gratefulness"}}, {"n": "5", "para": false, "poetry": false, "a": [{"t": "text", "s": "because I keep hearing about your faith in the master Yeshua (Jesus; Grk. Yesus) and your love for all the believers."}], "rv": "after hearing your faith and about your love for the master Yeshua (Jesus; Grk. Yesus) and for all the believers.", "xrefs": []}, {"n": "6", "para": false, "poetry": false, "a": [{"t": "text", "s": "I’m praying that the way you share your faith will become active as you recognize every good thing we have in the messiah."}, {"t": "note", "kind": "nerd", "s": "This verse is hard to translate even from the Greek. The OET draft this edition is based on flagged it as unclear, and translators disagree about it, so treat this as one reasonable reading, not the final word."}], "rv": "I pray that the fellowship of your faith may become active in the knowledge of every good thing in us toward the messiah, [WHAT DOES THAT MEAN???]", "xrefs": []}, {"n": "7", "para": false, "poetry": false, "a": [{"t": "text", "s": "I was so happy and encouraged by your love, because the hearts of the believers have been refreshed by you, brother."}], "rv": "because I was very happy and encouraged by your love, because the hearts of the believers have been refreshed by you, brother.", "xrefs": []}, {"n": "8", "para": true, "poetry": false, "a": [{"t": "text", "s": "Because I’m united with the messiah, I could be bold and simply tell you what you need to do,"}], "rv": "Therefore, with the help of the messiah, I would be brave enough to tell you what you need to do,", "xrefs": [], "h": {"a": "Paulos’s request about Onesimos", "rv": "Paulos’s request to Filemon concerning Onesimos"}}, {"n": "9", "para": false, "poetry": false, "a": [{"t": "text", "s": "but because of love I’d rather appeal to you instead, as Paulos, "}, {"t": "zs", "a": "an unc by now", "p": "an old man by now"}, {"t": "text", "s": ", and also a prisoner for Yeshua (Jesus; Grk. Yesus) the messiah."}, {"t": "note", "kind": "decoder", "s": "‘Unc’ is slang, short for ‘uncle’, for an older guy who’s a bit out of touch, though sometimes it’s said with respect. Paulos is calling himself an older man, and the Greek word here does mean that."}], "rv": "but because of love as Paulos, an older man and now also a prisoner for Yeshua (Jesus; Grk. Yesus) the messiah, I’m just going to encourage you to do it.", "xrefs": []}, {"n": "10", "para": false, "poetry": false, "a": [{"t": "text", "s": "I’m appealing to you about Onesimos,"}, {"t": "xref", "s": "Col 4:9"}, {"t": "text", "s": " who became my spiritual ‘son’ while I’ve been in prison."}, {"t": "note", "kind": "nerd", "s": "‘Onesimos’ was a real Greek name with the sense ‘useful’, which sets up the wordplay in the next verse."}], "rv": "So I’m going to encourage you concerning Onesimos who became my spiritual ‘son’ since I’ve been imprisoned.", "xrefs": ["Col 4:9."]}, {"n": "11", "para": false, "poetry": false, "a": [{"t": "text", "s": "Before, he was useless to you, but now he’s useful to both of us." d prepare somewhere for me to stay, because I’m hoping that I’ll be able to visit, thanks to you all praying for me.", "xrefs": [], "h": {"a": "Paulos’s final greetings", "rv": "Paulos’s final greetings"}}, {"n": "23", "para": false, "poetry": false, "a": [{"t": "text", "s": "Epafras (Epaphras),"}, {"t": "xref", "s": "Col 1:7; 4:12"}, {"t": "text", "s": " my fellow prisoner in Yeshua (Jesus; Grk. Yesus) the messiah, sends his greetings,"}], "rv": "Epafras (Epaphras), my fellow prisoner in Yeshua (Jesus; Grk. Yesus) the messiah, sends his greetings,", "xrefs": ["Col 1:7; 4:12."]}, {"n": "24", "para": false, "poetry": false, "a": [{"t": "text", "s": "and so do my fellow workers Markos,"}, {"t": "xref", "s": "Acts 12:12,25; 13:13; 15:37-39; Col 4:10"}, {"t": "text", "s": " Aristarkos,"}, {"t": "xref", "s": "Acts 19:29; 27:2; Col 4:10"}, {"t": "text", "s": " Demas,"}, {"t": "xref", "s": "Col 4:14; 2Tim 4:10"}, {"t": "text", "s": " and Lukas (Luke)."}, {"t": "xref", "s": "Col 4:14; 2Tim 4:11"}], "rv": "as do my fellow-workers Markos, Aristarkos, Demas, and Lukas (Luke).", "xrefs": ["Acts 12:12,25; 13:13; 15:37-39; Col 4:10.", "Acts 19:29; 27:2; Col 4:10.", "Col 4:14; 2Tim 4:10.", "Col 4:14; 2Tim 4:11."]}, {"n": "25", "para": true, "poetry": false, "a": [{"t": "text", "s": "May the grace of our master Yeshua the messiah be with the spirit of you all. May it be so."}], "rv": "May the grace of our master Yeshua the messiah be with the spirit of you all there. May it be so.", "xrefs": []}]}], "checks": {"verses": 25, "footnotes": 7, "decoder": 1, "nerd": 6, "spans": 1, "slang_hits": 1, "fk": {"rv": 9.734148689014273, "alpha": 8.536036282306167, "plain": 8.544047619047621}, "words_alpha": 502, "words_rv": 519, "errors": 0, "warnings": 0}}]};

const store = {
  get() { try { return JSON.parse(localStorage.getItem("oet-alpha-reader") || "{}"); } catch (e) { return {}; } },
  set(o) { try { localStorage.setItem("oet-alpha-reader", JSON.stringify(o)); } catch (e) {} }
};
const saved = store.get();
const state = {
  book: 0,
  mode: ["alpha", "plain", "compare"].indexOf(saved.mode) >= 0 ? saved.mode : "alpha",
  notes: saved.notes !== false
};

const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const md = (s) => esc(s).replace(/\*(.+?)\*/g, "<em>$1</em>");

function segHTML(segs, mode) {
  let out = "";
  segs.forEach((g) => {
    if (g.t === "text") out += esc(g.s);
    else if (g.t === "para") out += "<br>";
    else if (g.t === "zs") {
      if (mode === "plain") out += esc(g.p);
      else if (mode === "alpha" || mode === "compare") {
        out += '<mark class="slang" tabindex="0" role="button" aria-label="Slang: ' + esc(g.a) + '. Press for the plain wording." data-a="' + esc(g.a) + '" data-p="' + esc(g.p) + '">' + esc(g.a) + "</mark>";
      }
    } else if (g.t === "note") {
      if (!state.notes) return;
      if (g.kind === "decoder" && mode === "plain") return;
      const d = g.kind === "decoder";
      out += '<button type="button" class="nbtn ' + (d ? "d" : "n") + '" aria-expanded="false" aria-label="' + (d ? "Decoder note" : "Nerd note") + '">' + (d ? "D" : "N") + "</button>" +
             '<span class="notebox ' + (d ? "nb-d" : "nb-n") + '" hidden><b>' + (d ? "Decoder" : "Nerd note") + "</b>" + esc(g.s) + "</span>";
    }
  });
  return out;
}

function renderBook() {
  const b = DATA.books[state.book];
  const app = document.getElementById("app");
  const code = b.code.toLowerCase();
  app.className = state.mode === "compare" ? "wide" : "";
  let h = '<p class="eyebrow">OET Alpha Edition &middot; unofficial</p><h1>' + esc(b.title) + "</h1>";
  if (b.subtitle) h = h.replace("<h1>", '<p class="subtitle">' + esc(b.subtitle) + "</p><h1>");
  h += '<div class="intro">' + b.intro.map((p) => "<p>" + md(p) + "</p>").join("") + "</div>";
  if (state.mode !== "plain") h += '<p class="hint">Tap a <mark class="demo">highlighted</mark> word for its plain wording. <span style="font-family:var(--f-mono)">D</span> = Decoder, <span style="font-family:var(--f-mono)">N</span> = Nerd note.</p>';
  h += '<ul class="outline">' + b.outline.map((o, i) => '<li><a href="#' + code + "-" + (i + 1) + '">' + esc(o.text) + " <small>" + esc(o.ref) + "</small></a></li>").join("") + "</ul>";

  b.chapters.forEach((c) => {
    h += '<section class="chapter" id="' + code + "-" + c.n + '">';
    let open = "", first = true;
    const closeP = () => { if (open) { h += "</p>"; open = ""; } };
    c.verses.forEach((v) => {
      if (v.h) {
        closeP();
        if (first) h += '<p class="chapter-label">Chapter ' + c.n + "</p><h2>" + esc(v.h.a) + "</h2>";
        else h += "<h3>" + esc(v.h.a) + "</h3>";
      } else if (first) {
        h += '<p class="chapter-label">Chapter ' + c.n + "</p>";
      }
      first = false;
      if (v.sub) { closeP(); h += '<p class="sub">' + esc(v.sub) + "</p>"; }
      if (state.mode === "compare") {
        closeP();
        h += '<div class="pair"><div class="col rv"><span class="tag">OET-RV</span><sup class="v">' + esc(v.n) + "</sup>" + esc(v.rv).replace(/\n/g, "<br>") +
             '</div><div class="col"><span class="tag">Alpha</span><sup class="v">' + esc(v.n) + "</sup>" + segHTML(v.a, "compare") + "</div></div>";
        return;
      }
      if (v.poetry) { closeP(); h += '<p class="poetry">'; open = "poetry"; }
      else if (v.para || !open) { closeP(); h += '<p class="text">'; open = "text"; }
      h += '<sup class="v">' + esc(v.n) + "</sup>" + segHTML(v.a, state.mode) + " ";
    });
    closeP();
    h += "</section>";
  });

  h += checksPanel(b) + indexPanel(b, code);
  h += '<footer><p>Based on the <a href="https://github.com/Freely-Given-org/OpenEnglishTranslation--OET" rel="noopener">Open English Translation Readers&rsquo; Version</a> by Robert Hunt / Freely-Given.org, licensed <a href="https://creativecommons.org/licenses/by-sa/4.0/" rel="noopener">CC BY-SA 4.0</a>. This edition is licensed the same way. Changes: register adaptation, rewritten introductions and headings, added footnotes, simplified markup.</p>' +
       "<p>Not endorsed by the OET project. AI-assisted adaptation (the original is hand-made). A reading aid, not a study text: check the OET-RV and Literal Version for anything that matters. Slang ages fast, and so will this page.</p></footer>";
  app.innerHTML = h;
}

function checksPanel(b) {
  const k = b.checks || {}, fk = k.fk || { rv: 0, alpha: 0, plain: 0 };
  const max = Math.max(fk.rv, fk.alpha, fk.plain, 10);
  const row = (cls, lbl, val) => '<div class="bar-row"><span>' + lbl + '</span><div class="track"><div class="fill ' + cls + '" style="width:' + (100 * val / max).toFixed(1) + '%"></div></div><b>' + val.toFixed(1) + "</b></div>";
  return '<section class="panel"><h2>How this was checked</h2>' +
    '<ul class="facts"><li>' + (k.errors === 0 ? "No structural errors" : esc(k.errors) + " errors") + ": every chapter, verse, paragraph, poem line, cross-reference and number matches the OET-RV, verse for verse (" + esc(k.verses) + " verses).</li>" +
    "<li>All " + esc(k.spans) + " slang uses in this book carry a plain-word fallback. That is what the Plain button shows.</li>" +
    "<li>" + esc(k.footnotes) + " footnotes: " + esc(k.decoder) + " Decoder, " + esc(k.nerd) + " Nerd note. A Decoder note may only explain a word its verse actually uses.</li></ul>" +
    '<div class="bars" role="img" aria-label="Reading grade level. OET-RV ' + fk.rv.toFixed(1) + ", Alpha " + fk.alpha.toFixed(1) + ", Plain " + fk.plain.toFixed(1) + '">' +
    row("rv", "OET-RV", fk.rv) + row("alpha", "Alpha", fk.alpha) + row("plain", "Plain", fk.plain) + "</div>" +
    '<p class="fine">Flesch&ndash;Kincaid grade level, lower is easier. It is a rough measure with simple sentence splitting, so read it as a direction, not a verdict.</p></section>';
}

function indexPanel(b, code) {
  let rows = "";
  b.chapters.forEach((c) => c.verses.forEach((v) => v.a.forEach((g) => {
    if (g.t === "zs") rows += "<tr><td>" + c.n + ":" + esc(v.n) + "</td><td>" + esc(g.a) + "</td><td>" + (g.p ? esc(g.p) : "<em>(left out)</em>") + "</td></tr>";
  })));
  if (!rows) return "";
  return '<details><summary>Slang dial: Alpha wording and its plain version</summary><div class="scroll"><table><thead><tr><th>Verse</th><th>Alpha</th><th>Plain</th></tr></thead><tbody>' + rows + "</tbody></table></div></details>";
}

function syncControls() {
  document.querySelectorAll("#modes button").forEach((x) => x.setAttribute("aria-pressed", String(x.dataset.mode === state.mode)));
  document.querySelectorAll("#books button").forEach((x) => x.setAttribute("aria-pressed", String(Number(x.dataset.i) === state.book)));
  document.getElementById("notes").setAttribute("aria-pressed", String(state.notes));
}

function render() { syncControls(); renderBook(); store.set({ mode: state.mode, notes: state.notes }); }

function fromHash() {
  const m = /^#([a-z]+)(?:-(\d+))?$/.exec(location.hash);
  if (!m) return false;
  const i = DATA.books.findIndex((b) => b.code.toLowerCase() === m[1]);
  if (i < 0) return false;
  state.book = i;
  return m[2] || true;
}

document.getElementById("books").innerHTML = DATA.books.map((b, i) => '<button type="button" data-i="' + i + '" aria-pressed="false">' + esc(b.title.replace(/\s*\(.*\)/, "")) + "</button>").join("");

document.addEventListener("click", (e) => {
  const t = e.target;
  const modeBtn = t.closest("#modes button");
  if (modeBtn) { state.mode = modeBtn.dataset.mode; render(); return; }
  const bookBtn = t.closest("#books button");
  if (bookBtn) { state.book = Number(bookBtn.dataset.i); location.hash = DATA.books[state.book].code.toLowerCase(); render(); window.scrollTo(0, 0); return; }
  if (t.closest("#notes")) { state.notes = !state.notes; render(); return; }
  const nb = t.closest(".nbtn");
  if (nb) {
    const box = nb.nextElementSibling, open = nb.getAttribute("aria-expanded") === "true";
    nb.setAttribute("aria-expanded", String(!open)); box.hidden = open; return;
  }
  const sl = t.closest("mark.slang");
  if (sl) flip(sl);
});
document.addEventListener("keydown", (e) => {
  if ((e.key === "Enter" || e.key === " ") && e.target.matches && e.target.matches("mark.slang")) { e.preventDefault(); flip(e.target); }
});
function flip(el) {
  const showPlain = !el.classList.contains("flip");
  el.classList.toggle("flip", showPlain);
  el.classList.toggle("gone", showPlain && !el.dataset.p);
  el.textContent = showPlain ? (el.dataset.p || el.dataset.a) : el.dataset.a;
}

const h0 = fromHash();
render();
if (typeof h0 === "string") { const el = document.getElementById(DATA.books[state.book].code.toLowerCase() + "-" + h0); if (el) el.scrollIntoView(); }
window.addEventListener("hashchange", () => { const r = fromHash(); render(); if (typeof r === "string") { const el = document.getElementById(DATA.books[state.book].code.toLowerCase() + "-" + r); if (el) el.scrollIntoView(); } });
</script>
